name: Build & Verify Flang Bounds Sanitizer

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

# Cancel in-progress runs if new commits are pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Enable deep GitHub Actions step debugging natively
  ACTIONS_STEP_DEBUG: true

jobs:
  build-and-test:
    name: Compile & Verify LLVM/Flang
    runs-on: ubuntu-22.04 # Pinning to specific LTS for stability

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout LLVM (Shallow Clone)
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          path: llvm-project
          fetch-depth: 1

      - name: Install Optimized Build Toolchain
        run: |
          set -euxo pipefail
          echo "::group::Apt-Get Update & Install"
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang lld ccache
          echo "::endgroup::"
          
          echo "::group::Toolchain Versions"
          clang --version
          cmake --version
          ninja --version
          ccache --version
          echo "::endgroup::"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-flang-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-flang-
          max-size: 5G
          verbose: 2 # Maximum ccache verbosity logging

      - name: Integrate project files into LLVM
        run: |
          set -euxo pipefail
          
          echo "::group::Injecting Instrumentation Pass"
          cp -v project/src/pass/BoundsCheckInstrumentation.cpp llvm-project/flang/lib/Optimizer/Transforms/
          cp -v project/src/pass/BoundsCheckInstrumentation.h llvm-project/flang/include/flang/Optimizer/Transforms/ 2>/dev/null || true
          sed -i '/add_flang_library(FIRTransforms/a\  BoundsCheckInstrumentation.cpp' llvm-project/flang/lib/Optimizer/Transforms/CMakeLists.txt
          echo "::endgroup::"

          echo "::group::Injecting Runtime Library"
          RUNTIME_DIR=$(find llvm-project -type d \( -path "*/flang-rt/lib/runtime" -o -path "*/flang/runtime" \) | head -n 1)
          echo "Discovered Runtime Directory: $RUNTIME_DIR"
          cp -v project/src/runtime/bounds-check.cpp "$RUNTIME_DIR/"
          cp -v project/src/runtime/bounds-check.h "$RUNTIME_DIR/"
          
          if echo "$RUNTIME_DIR" | grep -q "flang-rt"; then
            sed -i '/add_flangrt_library(flang_rt.runtime/a\  bounds-check.cpp' "$RUNTIME_DIR/CMakeLists.txt"
          else
            sed -i '/add_flang_library(FlangRuntime/a\  bounds-check.cpp' "$RUNTIME_DIR/CMakeLists.txt"
          fi
          echo "::endgroup::"

          echo "::group::Patching Pipelines.cpp"
          # Insert the header include to prevent undeclared identifier compilation errors
          sed -i '1s/^/#include "flang\/Optimizer\/Transforms\/BoundsCheckInstrumentation.h"\n/' llvm-project/flang/lib/Optimizer/Passes/Pipelines.cpp
          sed -i '/pm.addPass(hlfir::createLowerHLFIRIntrinsics());/i\  pm.addPass(fir::createHLFIRBoundsCheckPass());' llvm-project/flang/lib/Optimizer/Passes/Pipelines.cpp
          echo "::endgroup::"

      - name: Configure CMake
        run: |
          set -euxo pipefail
          cd llvm-project
          mkdir -p build && cd build
          
          echo "::group::CMake Configuration"
          # -DCMAKE_VERBOSE_MAKEFILE=ON forces CMake to log its exact internal decisions
          cmake -G Ninja ../llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DLLVM_ENABLE_PROJECTS="flang;mlir" \
            -DLLVM_ENABLE_RUNTIMES="flang-rt" \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_USE_LINKER=lld \
            -DBUILD_SHARED_LIBS=ON \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_BUILD_DOCS=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=1
          echo "::endgroup::"

      - name: Build Flang (Max Verbosity)
        run: |
          set -euxo pipefail
          echo "::group::CCache Stats (Before Build)"
          ccache -s
          echo "::endgroup::"
          
          cd llvm-project/build
          
          echo "::group::Ninja Build Execution (Real-Time Output)"
          # -v forces Ninja to print the EXACT compiler commands it executes in real-time
          # We use the 'flang' meta-target which safely encapsulates the driver, passes, and runtime.
          ninja -v flang
          echo "::endgroup::"

      - name: Post-Build CCache Stats
        run: |
          set -euxo pipefail
          echo "::group::CCache Stats (After Build)"
          ccache -s
          echo "::endgroup::"

      - name: Verify Bounds Sanitizer execution
        run: |
          set -euxo pipefail
          cd llvm-project/build
          
          echo "::group::Compiling Demonstration Program (Verbose)"
          # -v asks the flang compiler driver to output its internal phases
          bin/flang-new -v -O2 -fcheck=bounds ../../project/src/demo/demo.f90 -o demo_run
          echo "::endgroup::"
          
          echo "::group::Executing Demonstration Program"
          ./demo_run 2> demo_error.log || true
          echo "::endgroup::"
          
          echo "::group::Captured Stderr Output"
          cat demo_error.log
          echo "::endgroup::"
          
          echo "::group::Verification Assertion"
          if grep -q "HLFIR BOUNDS VIOLATION DETECTED" demo_error.log; then
            echo "✅ SUCCESS: The bounds sanitizer correctly intercepted the OOB access and printed the diagnostic."
          else
            echo "❌ FAILURE: The bounds sanitizer did not intercept the error as expected."
            exit 1
          fi
          echo "::endgroup::"

      - name: Upload flang-new binary
        uses: actions/upload-artifact@v4
        with:
          name: flang-new-linux-x86_64
          path: llvm-project/build/bin/flang-new
          retention-days: 3
