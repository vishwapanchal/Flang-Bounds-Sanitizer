name: Flang Bounds Sanitizer

# Trigger on pushes/PRs. Incremental rebuilds are driven by cache keys below,
# not by path filters, so any change still runs but reuses cached artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  LLVM_VERSION: "19.1.7"
  LLVM_TARBALL: "llvm-project-19.1.7.src.tar.xz"
  LLVM_URL: "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/llvm-project-19.1.7.src.tar.xz"
  # Root where we unpack and build. Kept stable for cache reuse.
  WORK: "${{ github.workspace }}/llvm-work"
  INSTALL_DIR: "${{ github.workspace }}/flang-install"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  # Limit linker parallelism to avoid OOM (ld of clang/flang is memory-heavy).
  LINK_JOBS: "2"

jobs:
  build-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout your project (custom pass + runtime + demo) untouched.
      # ---------------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache python3 xz-utils \
            build-essential libzstd-dev zlib1g-dev

      # ---------------------------------------------------------------
      # 2. Compute a hash of ONLY the custom pass/runtime/demo files.
      #    When these are unchanged, the Flang-artifact cache hits and we
      #    skip the expensive LLVM/Flang build entirely.
      # ---------------------------------------------------------------
      - name: Compute source fingerprint
        id: fp
        run: |
          set -euxo pipefail
          SRC_HASH=$(cat \
            project/src/pass/BoundsCheckInstrumentation.cpp \
            project/src/pass/BoundsCheckInstrumentation.h \
            project/src/runtime/bounds-check.cpp \
            project/src/runtime/bounds-check.h \
            | sha256sum | cut -d' ' -f1)
          echo "src_hash=${SRC_HASH}" >> "$GITHUB_OUTPUT"
          echo "Custom source hash: ${SRC_HASH}"

      # ---------------------------------------------------------------
      # 3. Cache the LLVM source TARBALL (avoids re-downloading ~140MB).
      #    Keyed only on the LLVM version.
      # ---------------------------------------------------------------
      - name: Cache LLVM source tarball
        id: cache-tarball
        uses: actions/cache@v4
        with:
          path: ${{ env.LLVM_TARBALL }}
          key: llvm-tarball-${{ env.LLVM_VERSION }}

      - name: Download LLVM source tarball
        if: steps.cache-tarball.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o "${LLVM_TARBALL}" "${LLVM_URL}"

      # ---------------------------------------------------------------
      # 4. Cache the MINIMAL Flang artifacts (compiler binaries + required
      #    libs + install dir), NOT the whole multi-GB build tree.
      #    Key includes the custom-source hash so changing the pass/runtime
      #    invalidates it and forces an incremental rebuild.
      # ---------------------------------------------------------------
      - name: Cache Flang artifacts
        id: cache-flang
        uses: actions/cache@v4
        with:
          path: ${{ env.INSTALL_DIR }}
          key: flang-artifacts-${{ env.LLVM_VERSION }}-${{ steps.fp.outputs.src_hash }}

      # ---------------------------------------------------------------
      # 5. ccache: speeds up incremental rebuilds of the pass/runtime even
      #    when the artifact cache misses (e.g. source changed slightly).
      # ---------------------------------------------------------------
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.LLVM_VERSION }}-${{ steps.fp.outputs.src_hash }}
          restore-keys: |
            ccache-${{ env.LLVM_VERSION }}-

      - name: Configure ccache
        run: |
          set -euxo pipefail
          ccache --max-size=5G
          ccache --zero-stats

      # ---------------------------------------------------------------
      # 6. Unpack LLVM source (skipped if Flang artifacts already cached).
      # ---------------------------------------------------------------
      - name: Unpack LLVM source
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "${WORK}"
          tar -xf "${LLVM_TARBALL}" -C "${WORK}" --strip-components=1

      # ---------------------------------------------------------------
      # 7. Inject custom pass + runtime with VALIDATED, IDEMPOTENT patching.
      #    Every sed is guarded: we verify the target exists before patching
      #    and check the patch isn't already applied (idempotency for reruns).
      # ---------------------------------------------------------------
      - name: Integrate custom bounds sanitizer
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          FLANG="${WORK}/flang"

          # --- Pre-flight: fail clearly if LLVM structure changed ---
          fail() { echo "::error::$1"; exit 1; }

          PASS_DIR="${FLANG}/lib/Optimizer/Transforms"
          PASS_HDR_DIR="${FLANG}/include/flang/Optimizer/Transforms"
          RT_DIR="${FLANG}/runtime"
          [ -d "${FLANG}" ]        || fail "Flang tree missing — LLVM source structure changed."
          [ -d "${PASS_DIR}" ]     || fail "Optimizer/Transforms dir missing — structure changed."
          [ -f "${PASS_DIR}/CMakeLists.txt" ] || fail "Transforms CMakeLists.txt missing."
          [ -d "${RT_DIR}" ]       || fail "Flang runtime dir missing — structure changed."
          [ -f "${RT_DIR}/CMakeLists.txt" ]   || fail "Runtime CMakeLists.txt missing."

          # --- Copy custom files verbatim (sources are never modified) ---
          mkdir -p "${PASS_HDR_DIR}"
          cp project/src/pass/BoundsCheckInstrumentation.cpp "${PASS_DIR}/"
          cp project/src/pass/BoundsCheckInstrumentation.h   "${PASS_HDR_DIR}/"
          cp project/src/runtime/bounds-check.cpp "${RT_DIR}/"
          cp project/src/runtime/bounds-check.h   "${RT_DIR}/"

          # --- Register pass source (idempotent) ---
          if ! grep -q "BoundsCheckInstrumentation.cpp" "${PASS_DIR}/CMakeLists.txt"; then
            # Insert before the closing paren of the first source list.
            sed -i '0,/^  [A-Za-z].*\.cpp$/s//  BoundsCheckInstrumentation.cpp\n&/' \
              "${PASS_DIR}/CMakeLists.txt"
            grep -q "BoundsCheckInstrumentation.cpp" "${PASS_DIR}/CMakeLists.txt" \
              || fail "Failed to register pass in Transforms CMakeLists.txt."
          else
            echo "Pass already registered — skipping (idempotent)."
          fi

          # --- Register runtime source (idempotent) ---
          if ! grep -q "bounds-check.cpp" "${RT_DIR}/CMakeLists.txt"; then
            sed -i '0,/^  [A-Za-z].*\.cpp$/s//  bounds-check.cpp\n&/' \
              "${RT_DIR}/CMakeLists.txt"
            grep -q "bounds-check.cpp" "${RT_DIR}/CMakeLists.txt" \
              || fail "Failed to register runtime source in CMakeLists.txt."
          else
            echo "Runtime source already registered — skipping (idempotent)."
          fi

          # --- Inject createHLFIRBoundsCheckPass() into the pipeline ---
          PIPELINE="${FLANG}/lib/Frontend/FrontendActions.cpp"
          [ -f "${PIPELINE}" ] || fail "Pipeline file FrontendActions.cpp missing — structure changed."
          
          # Prepend include only if not already present (idempotent on retry)
          if ! grep -q "BoundsCheckInstrumentation.h" "${PIPELINE}"; then
            sed -i '1s|^|#include "flang/Optimizer/Transforms/BoundsCheckInstrumentation.h"\n|' \
                "${PIPELINE}"
          fi

          if ! grep -q "createHLFIRBoundsCheckPass" "${PIPELINE}"; then
            # Anchor on a known pass-manager add point; adjust anchor if upstream renames it.
            grep -q "pm.addPass" "${PIPELINE}" \
              || fail "Pipeline anchor 'pm.addPass' not found — pipeline API changed."
            sed -i '0,/pm.addPass(/s//pm.addPass(fir::createHLFIRBoundsCheckPass());\n  pm.addPass(/' \
              "${PIPELINE}"
            grep -q "createHLFIRBoundsCheckPass" "${PIPELINE}" \
              || fail "Failed to inject createHLFIRBoundsCheckPass()."
          else
            echo "Pass already injected into pipeline — skipping (idempotent)."
          fi

      # ---------------------------------------------------------------
      # 8. Configure + build Flang.
      #    -j = all cores for compile; LLVM_PARALLEL_LINK_JOBS caps linker
      #    parallelism to avoid OOM. ccache wraps the compilers.
      # ---------------------------------------------------------------
      - name: Configure and build Flang
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          NPROC=$(nproc)
          cmake -G Ninja -S "${WORK}/llvm" -B "${WORK}/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;mlir;flang" \
            -DLLVM_TARGETS_TO_BUILD="host" \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
            -DLLVM_CCACHE_BUILD=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_PARALLEL_LINK_JOBS="${LINK_JOBS}" \
            -DLLVM_PARALLEL_COMPILE_JOBS="${NPROC}"

          # Build only flang + needed runtime targets, then install the
          # minimal set so the artifact cache stays small.
          ninja -C "${WORK}/build" -j "${NPROC}" flang
          ninja -C "${WORK}/build" -j "${NPROC}" install

      - name: Show ccache stats
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: ccache --show-stats

      # ---------------------------------------------------------------
      # 9. VERIFICATION — runs every time, even on full cache hit.
      #    Compiles the demo, runs it, asserts the sanitizer fires.
      # ---------------------------------------------------------------
      - name: Compile and run demo, verify sanitizer
        run: |
          set -euxo pipefail
          FLANG_BIN="${INSTALL_DIR}/bin/flang-new"
          [ -x "${FLANG_BIN}" ] || FLANG_BIN="${INSTALL_DIR}/bin/flang"
          [ -x "${FLANG_BIN}" ] || { echo "::error::flang binary not found in install dir"; exit 1; }

          export LD_LIBRARY_PATH="${INSTALL_DIR}/lib:${LD_LIBRARY_PATH:-}"

          "${FLANG_BIN}" project/src/demo/demo.f90 -o demo_exe

          # Capture stderr; do not let a nonzero exit kill the script yet —
          # the sanitizer is expected to abort.
          set +e
          ./demo_exe 2> demo_stderr.txt
          set -e
          echo "----- demo stderr -----"
          cat demo_stderr.txt

          if grep -q "HLFIR BOUNDS VIOLATION DETECTED" demo_stderr.txt; then
            echo "✅ Sanitizer triggered as expected."
          else
            echo "::error::Sanitizer did NOT trigger — expected 'HLFIR BOUNDS VIOLATION DETECTED' in stderr."
            exit 1
          fi
