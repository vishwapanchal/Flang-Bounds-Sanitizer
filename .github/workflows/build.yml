name: Build & Verify Flang Bounds Sanitizer

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

env:
  LLVM_VERSION: "19.1.7"
  CACHE_EPOCH: "v2"                     # bump to force a full rebuild
  DEBIAN_FRONTEND: noninteractive       # [OPT-8] prevent apt-get hangs
  SCCACHE_GHA_ENABLED: "true"           # [OPT-1] sccache → GHA backend
  LLVM_TARBALL_SHA256: "59abea1c22e64933fad4de1671a61cdb934098793c7a31b333ff58dc41bff36c"

jobs:
  # ───────────────────────────────────────────────────────────────
  # Job 1 – Fortran syntax validation
  # [OPT-4] Path filter: skip this job entirely if no .f90 files
  # were changed in a PR (saves ~2 min on docs-only pushes).
  # ───────────────────────────────────────────────────────────────
  validate-tests:
    name: Validate Fortran Syntax
    runs-on: ubuntu-22.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, '.f90')

    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran

      - name: Syntax-check all test files
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            src/tests/tc*.f90
            src/benchmark/*.f90
            src/demo/demo.f90
          )
          shopt -u nullglob

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No Fortran source files matched the expected globs."
            exit 1
          fi

          echo "Checking ${#files[@]} Fortran file(s)..."
          errors=0
          for f in "${files[@]}"; do
            if err=$(gfortran -fsyntax-only -std=f2008 "$f" 2>&1); then
              echo "  ✓ $f"
            else
              echo "  ✗ $f"
              echo "$err" | sed 's/^/      /'
              errors=$((errors + 1))
            fi
          done

          [ $errors -eq 0 ] || { echo "::error::$errors file(s) had syntax errors."; exit 1; }
          echo "All ${#files[@]} files passed syntax validation."

  # ───────────────────────────────────────────────────────────────
  # Job 2 – Build Compiler
  # ───────────────────────────────────────────────────────────────
  build-flang:
    name: Build Compiler
    runs-on: ubuntu-22.04

    steps:
      # ── 0. Environment snapshot ──────────────────────────────────
      - name: Environment snapshot
        run: |
          echo "Runner: $(uname -r) | Cores: $(nproc) | RAM: $(free -h | awk '/^Mem/{print $2}')"
          df -h /

      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      # ── 2. Swap (fallocate — near-instant) ────────────────────────
      - name: Create swap space (8 GB)
        run: |
          if ! swapon --show | grep -q /swapfile_extra; then
            sudo fallocate -l 8G /swapfile_extra
            sudo chmod 600 /swapfile_extra
            sudo mkswap  /swapfile_extra
            sudo swapon  /swapfile_extra
          fi
          echo "Swap: $(free -h | awk '/^Swap/{print $2}')"

      # ── 3. Restore Flang cache ──────────────────────────
      - name: Restore Flang cache
        id: cache-flang
        uses: actions/cache/restore@v4
        with:
          path: |
            flang-artefacts
            llvm-project/build/CMakeCache.txt
            llvm-project/build/build.ninja
          key: >-
            ${{ env.CACHE_EPOCH }}-${{ runner.os }}-flang-${{ env.LLVM_VERSION }}-${{
              hashFiles(
                'project/src/pass/**',
                'project/src/runtime/**'
              )
            }}
          restore-keys: |
            ${{ env.CACHE_EPOCH }}-${{ runner.os }}-flang-${{ env.LLVM_VERSION }}-

      # ── 3b. Cache hit/miss indicator ──────────────────────────────
      - name: Cache hit indicator
        run: |
          if [ "${{ steps.cache-flang.outputs.cache-hit }}" = "true" ]; then
            echo "========================================================"
            echo "🚀 CACHE HIT: Restored pre-compiled Flang distribution!"
            echo "========================================================"
            echo "### 🚀 CACHE HIT: Restored pre-compiled Flang!" >> $GITHUB_STEP_SUMMARY
            echo "Skipping compiler rebuild. Verification tests will start immediately." >> $GITHUB_STEP_SUMMARY
          else
            echo "========================================================"
            echo "🔧 CACHE MISS: Compiling LLVM/Flang from source..."
            echo "========================================================"
            echo "### 🔧 CACHE MISS: Re-building compiler..." >> $GITHUB_STEP_SUMMARY
            echo "Initiating parallel compiler build with sccache caching." >> $GITHUB_STEP_SUMMARY
          fi

      # ── 4. Install build toolchain (skip on full cache hit) ───────
      - name: Install build toolchain
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld

      # ── 5. Setup sccache (replaces ccache-action) ─────────
      - name: Setup sccache
        if: steps.cache-flang.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.5
        with:
          version: "v0.7.7"

      # ── 5b. Verify sccache server and start explicitly ──────────────────
      - name: Verify sccache status
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          set +e
          echo "Starting sccache server..."
          sccache --start-server
          exit_code=$?
          if [ $exit_code -ne 0 ] || ! sccache --show-stats >/dev/null 2>&1; then
            echo "sccache-failed=true" >> $GITHUB_ENV
            echo "::warning::sccache server failed to start. Falling back to local compiling."
          else
            echo "sccache server started successfully."
          fi
          set -e

      # ── 6. LLVM tarball cache ─────────────────────────────────────
      - name: Restore LLVM tarball
        if: steps.cache-flang.outputs.cache-hit != 'true'
        id: cache-tarball
        uses: actions/cache/restore@v4
        with:
          path: llvm-project-${{ env.LLVM_VERSION }}.tar.gz
          key: llvm-tarball-${{ env.LLVM_VERSION }}
          restore-keys: llvm-tarball-

      - name: Download & verify LLVM tarball
        if: >-
          steps.cache-flang.outputs.cache-hit != 'true' &&
          steps.cache-tarball.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-connrefused \
            --connect-timeout 30 --max-time 600 \
            "https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ env.LLVM_VERSION }}.tar.gz" \
            -o "llvm-project-${{ env.LLVM_VERSION }}.tar.gz"

          if [ "${{ env.LLVM_TARBALL_SHA256 }}" != "your-sha256-here" ]; then
            echo "${{ env.LLVM_TARBALL_SHA256 }}  llvm-project-${{ env.LLVM_VERSION }}.tar.gz" \
              | sha256sum --check --status \
              || { echo "::error::Tarball SHA-256 mismatch — download may be corrupt."; exit 1; }
          fi
          echo "Tarball size: $(du -sh llvm-project-${{ env.LLVM_VERSION }}.tar.gz | cut -f1)"

      - name: Save LLVM tarball to cache
        if: >-
          steps.cache-flang.outputs.cache-hit != 'true' &&
          steps.cache-tarball.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: llvm-project-${{ env.LLVM_VERSION }}.tar.gz
          key: llvm-tarball-${{ env.LLVM_VERSION }}

      # ── 7. Extract LLVM ───────────────────────────────────────────
      - name: Extract LLVM tarball
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          mkdir -p llvm-project
          tar -xf "llvm-project-${{ env.LLVM_VERSION }}.tar.gz" \
              --strip-components=1 -C llvm-project
          echo "Extraction complete."

      # ── 8. Integrate project into LLVM tree ───────────────────────
      - name: Integrate project into LLVM tree
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          # ── 8a. Pass ────────────────────────────────────────────────
          cp project/src/pass/BoundsCheckInstrumentation.cpp \
             llvm-project/flang/lib/Optimizer/Transforms/
          cp project/src/pass/BoundsCheckInstrumentation.h \
             llvm-project/flang/include/flang/Optimizer/Transforms/

          PASS_CMAKE=llvm-project/flang/lib/Optimizer/Transforms/CMakeLists.txt
          grep -q 'add_flang_library(FIRTransforms' "$PASS_CMAKE" || {
            echo "::error::Anchor 'add_flang_library(FIRTransforms' not found in $PASS_CMAKE"
            exit 1
          }
          sed -i '/add_flang_library(FIRTransforms/a\  BoundsCheckInstrumentation.cpp' \
             "$PASS_CMAKE"

          # ── 8b. Runtime ─────────────────────────────────────────────
          RUNTIME_DIR=$(find llvm-project -type d \
              \( -path "*/flang-rt/lib/runtime" -o -path "*/flang/runtime" \) \
              | head -n 1)
          [ -n "$RUNTIME_DIR" ] || { echo "::error::Could not locate flang runtime directory."; exit 1; }
          echo "Runtime dir: $RUNTIME_DIR"

          cp project/src/runtime/bounds-check.cpp "$RUNTIME_DIR/"
          cp project/src/runtime/bounds-check.h   "$RUNTIME_DIR/"

          RT_CMAKE="$RUNTIME_DIR/CMakeLists.txt"
          if echo "$RUNTIME_DIR" | grep -q "flang-rt"; then
            ANCHOR='add_flangrt_library(flang_rt.runtime'
          else
            ANCHOR='add_flang_library(FortranRuntime'
          fi
          grep -q "$ANCHOR" "$RT_CMAKE" || { echo "::error::Anchor '$ANCHOR' not found in $RT_CMAKE"; exit 1; }
          sed -i "/$ANCHOR/a\  bounds-check.cpp" "$RT_CMAKE"

          # ── 8c. Pipeline patch ──────────────────────────────────────
          CLOPTS=llvm-project/flang/include/flang/Tools/CLOptions.inc
          PASS_ANCHOR='pm.addPass(hlfir::createLowerHLFIRIntrinsics());'
          grep -q "$PASS_ANCHOR" "$CLOPTS" || {
            echo "::error::Pipeline anchor not found in CLOptions.inc"
            exit 1
          }
          if ! grep -q 'BoundsCheckInstrumentation.h' "$CLOPTS"; then
            sed -i '1s|^|#include "flang/Optimizer/Transforms/BoundsCheckInstrumentation.h"\n|' \
                "$CLOPTS"
          fi
          if ! grep -q 'createHLFIRBoundsCheckPass' "$CLOPTS"; then
            sed -i "/$PASS_ANCHOR/i\  pm.addPass(fir::createHLFIRBoundsCheckPass());" \
                "$CLOPTS"
          fi
          echo "All integrations applied."

      # ── 9. CMake configure ────────────────────────────────────────
      - name: Configure CMake
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          cd llvm-project && mkdir -p build && cd build
          
          # Gracefully toggle sccache based on startup validation
          LAUNCHER_FLAGS=""
          if [ "${{ env.sccache-failed }}" != "true" ]; then
            echo "sccache server is active. Enabling compiler caching."
            LAUNCHER_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          else
            echo "sccache server is down. Bypassing cache to build locally."
          fi

          cmake -G Ninja ../llvm \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_ENABLE_PROJECTS="clang;flang;mlir" \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            $LAUNCHER_FLAGS \
            -DLLVM_USE_LINKER=lld \
            -DBUILD_SHARED_LIBS=ON \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_BUILD_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=1

      # ── 10. Build flang (compiler + runtime) ──────────────────────
      - name: Build flang (compiler + runtime)
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          cd llvm-project/build
          export NINJA_STATUS="[%f/%t] %e "
          export CFLAGS="-pipe"
          export CXXFLAGS="-pipe"
          ninja -j$(nproc) flang-new FortranRuntime
          echo "Build complete. flang-new size: $(du -sh bin/flang-new | cut -f1)"
          
          if [ "${{ env.sccache-failed }}" != "true" ]; then
            sccache --show-stats
          fi

      # ── 11. Stage Flang artefacts for cache ──────────────────────
      - name: Stage Flang artefacts for cache
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          mkdir -p flang-artefacts/bin flang-artefacts/lib
          cp -l llvm-project/build/bin/flang-new flang-artefacts/bin/ 2>/dev/null \
            || cp llvm-project/build/bin/flang-new flang-artefacts/bin/
          find llvm-project/build/lib \( -name '*.so*' -o -name '*.a' \) -type f \
            -exec cp -Pl {} flang-artefacts/lib/ \; 2>/dev/null \
            || find llvm-project/build/lib \( -name '*.so*' -o -name '*.a' \) -type f \
               -exec cp -P {} flang-artefacts/lib/ \;
          echo "Artefact sizes:"
          du -sh flang-artefacts/bin flang-artefacts/lib

      # ── 12. Save Flang artefact cache ────────────────────────────
      - name: Save Flang artefact cache
        if: steps.cache-flang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            flang-artefacts
            llvm-project/build/CMakeCache.txt
            llvm-project/build/build.ninja
          key: >-
            ${{ env.CACHE_EPOCH }}-${{ runner.os }}-flang-${{ env.LLVM_VERSION }}-${{
              hashFiles(
                'project/src/pass/**',
                'project/src/runtime/**'
              )
            }}

      # ── 13. Upload compiler distribution artifact ─────────────────
      - name: Upload compiler distribution
        uses: actions/upload-artifact@v4
        with:
          name: flang-compiler-dist
          path: flang-artefacts/
          retention-days: 1

  # ───────────────────────────────────────────────────────────────
  # Job 3 – Verify Bounds Check Demo
  # ───────────────────────────────────────────────────────────────
  verify-demo:
    name: Verify Bounds Check Demo
    needs: [build-flang, validate-tests]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          path: project

      - name: Download compiler distribution
        uses: actions/download-artifact@v4
        with:
          name: flang-compiler-dist
          path: flang-compiler-dist

      - name: Run bounds check demo
        run: |
          set -euo pipefail
          chmod +x flang-compiler-dist/bin/flang-new
          FLANG=flang-compiler-dist/bin/flang-new
          export LD_LIBRARY_PATH="$PWD/flang-compiler-dist/lib:${LD_LIBRARY_PATH:-}"

          echo "Using flang: $FLANG ($($FLANG --version 2>&1 | head -1))"

          "$FLANG" -O2 -fcheck=bounds \
            project/src/demo/demo.f90 \
            -o demo_run

          timeout 30 ./demo_run 2>demo_error.log || true

          echo "--- demo stderr ---"
          cat demo_error.log
          echo "-------------------"

          if grep -q "HLFIR BOUNDS VIOLATION DETECTED" demo_error.log; then
            echo "✓ SUCCESS: Bounds sanitizer correctly intercepted the OOB access."
          else
            echo "::error::Bounds sanitizer did NOT intercept the out-of-bounds access."
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────
  # Job 4 – Verify Sanitizer Test Suite (22 Cases)
  # ───────────────────────────────────────────────────────────────
  verify-test-suite:
    name: Verify Sanitizer Test Suite (22 Cases)
    needs: [build-flang, validate-tests]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          path: project

      - name: Download compiler distribution
        uses: actions/download-artifact@v4
        with:
          name: flang-compiler-dist
          path: flang-compiler-dist

      - name: Run test suite
        run: |
          set -euo pipefail
          chmod +x flang-compiler-dist/bin/flang-new
          FLANG=flang-compiler-dist/bin/flang-new
          export LD_LIBRARY_PATH="$PWD/flang-compiler-dist/lib:${LD_LIBRARY_PATH:-}"

          echo "========================================================"
          echo "       RUNNING BOUNDS CHECK SANITIZER TEST SUITE"
          echo "========================================================"
          
          passed=0
          failed=0
          total=22
          
          # Initialize dynamic JSON array
          echo "[" > results.json
          
          for i in $(seq -f "%02g" 1 22); do
            file=$(find project/src/tests -name "tc${i}_*.f90" | head -n 1)
            if [ -z "$file" ]; then
              echo "::warning::Test case $i not found, skipping."
              continue
            fi
            
            name=$(basename "$file" .f90)
            echo -n "Running $name... "
            
            status="fail"
            
            # Compile the test case
            if ! "$FLANG" -O2 -fcheck=bounds "$file" -o "test_$name" 2>compile_err.log; then
              echo -e "\033[0;31mFAILED TO COMPILE\033[0m"
              cat compile_err.log | sed 's/^/  /'
              failed=$((failed + 1))
              status="fail"
              
              comma=","
              [ "$i" -eq 22 ] && comma=""
              echo "  { \"id\": \"TC-$i\", \"status\": \"$status\" }$comma" >> results.json
              continue
            fi
            
            # Determine if this is a negative test (valid accesses only, e.g. tc11, tc22)
            # or a positive test (bounds violation expected, e.g. tc01-10, tc12-21)
            is_valid=0
            if [ "$i" -eq 11 ] || [ "$i" -eq 22 ]; then
              is_valid=1
            fi
            
            # Run the test case
            set +e
            timeout 10 "./test_$name" 2>run_err.log
            exit_code=$?
            set -e
            
            if [ $is_valid -eq 1 ]; then
              # Valid test case: should succeed with exit code 0
              if [ $exit_code -eq 0 ]; then
                echo -e "\033[0;32m✓ PASSED (Executed successfully)\033[0m"
                passed=$((passed + 1))
                status="pass"
              else
                echo -e "\033[0;31m✗ FAILED (Program crashed but should have succeeded)\033[0m"
                cat run_err.log | sed 's/^/  /'
                failed=$((failed + 1))
                status="fail"
              fi
            else
              # Invalid test case: bounds violation expected, program should crash and emit diagnostics
              if grep -q "HLFIR BOUNDS VIOLATION DETECTED" run_err.log; then
                echo -e "\033[0;32m✓ PASSED (Violation intercepted successfully)\033[0m"
                passed=$((passed + 1))
                status="pass"
              else
                echo -e "\033[0;31m✗ FAILED (Sanitizer failed to intercept violation)\033[0m"
                echo "  Exit code: $exit_code"
                cat run_err.log | sed 's/^/  /'
                failed=$((failed + 1))
                status="fail"
              fi
            fi
            
            # Write outcomes to dynamic JSON records
            comma=","
            [ "$i" -eq 22 ] && comma=""
            echo "  { \"id\": \"TC-$i\", \"status\": \"$status\" }$comma" >> results.json
            
            rm -f "test_$name" run_err.log compile_err.log
          done
          
          echo "]" >> results.json
          
          echo "========================================================"
          echo " TEST SUITE SUMMARY: $passed / $total PASSED"
          echo "========================================================"
          
          if [ $failed -gt 0 ]; then
            echo "::error::$failed test case(s) failed verification."
            exit 1
          fi

      - name: Upload test results JSON
        uses: actions/upload-artifact@v4
        with:
          name: test-results-json
          path: results.json
          retention-days: 1

  # ───────────────────────────────────────────────────────────────
  # Job 5 – Package & Publish Release
  # ───────────────────────────────────────────────────────────────
  publish-release:
    name: Package & Publish Release
    needs: [build-flang]
    runs-on: ubuntu-22.04

    steps:
      - name: Download compiler distribution
        uses: actions/download-artifact@v4
        with:
          name: flang-compiler-dist
          path: flang-compiler-dist

      - name: Create release tarball
        run: |
          mkdir -p release/bin release/lib
          cp flang-compiler-dist/bin/flang-new release/bin/
          cp -P flang-compiler-dist/lib/* release/lib/ 2>/dev/null || cp flang-compiler-dist/lib/* release/lib/
          tar -czf flang-bounds-sanitizer-linux-x86_64.tar.gz -C release bin lib
          echo "Package size: $(du -sh flang-bounds-sanitizer-linux-x86_64.tar.gz | cut -f1)"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: flang-bounds-sanitizer-linux-x86_64
          path: flang-bounds-sanitizer-linux-x86_64.tar.gz
          retention-days: 7

  # ───────────────────────────────────────────────────────────────
  # Job 6 – Deploy Live Dashboard to GitHub Pages
  # ───────────────────────────────────────────────────────────────
  deploy-dashboard:
    name: Deploy Live Dashboard
    needs: [verify-demo, verify-test-suite]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: project

      - name: Download test results JSON
        uses: actions/download-artifact@v4
        with:
          name: test-results-json
          path: results-json-dir

      - name: Setup pages
        uses: actions/configure-pages@v4

      - name: Prepare dashboard site
        run: |
          mkdir -p site
          cp -r project/dashboard/* site/
          cp results-json-dir/results.json site/
          echo "Dashboard files prepared:"
          ls -la site

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output dashboard link
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "### 🚀 Live Dashboard Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "The array bounds checking sanitizer dashboard is now live on GitHub Pages!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[Open Live Dashboard]($URL)**" >> $GITHUB_STEP_SUMMARY