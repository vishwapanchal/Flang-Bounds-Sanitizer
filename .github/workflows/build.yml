name: Build & Verify Flang Bounds Sanitizer

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Job 1: Validate Fortran test syntax (fast, no LLVM build)
  # ---------------------------------------------------------------
  validate-tests:
    name: Validate Fortran Syntax
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran
        run: sudo apt-get update -qq && sudo apt-get install -y gfortran

      - name: Syntax-check all test files
        run: |
          echo "Checking Fortran syntax for all test and benchmark files..."
          errors=0
          for f in src/tests/tc*.f90 src/benchmark/*.f90 src/demo/demo.f90; do
            if gfortran -fsyntax-only -std=f2008 "$f" 2>/dev/null; then
              echo "  OK: $f"
            else
              echo "  FAIL: $f"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "::error::$errors file(s) had syntax errors."
            exit 1
          fi
          echo "All files passed syntax validation."

  # ---------------------------------------------------------------
  # Job 2: Extreme Pre-flight Environment & Dependency Checks
  # ---------------------------------------------------------------
  extreme-preflight-checks:
    name: Extreme Environment & Limits Validation
    runs-on: ubuntu-22.04
    steps:
      - name: Validate System Hardware (CPU & RAM)
        run: |
          echo "=== CPU ARCHITECTURE & LIMITS ==="
          lscpu
          echo "Total Cores Available: $(nproc)"
          echo "=== MEMORY (RAM & SWAP) LIMITS ==="
          free -h
          vmstat -s
      
      - name: Validate Storage Limits
        run: |
          echo "=== DISK SPACE LIMITS ==="
          df -h
          echo "=== I/O LIMITS & FILE SYSTEM ==="
          lsblk -f

      - name: Validate Build Dependencies & Compilers
        run: |
          echo "=== INSTALLING DEPENDENCIES ==="
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang lld ccache git python3
          echo "=== VERIFYING DEPENDENCY VERSIONS ==="
          cmake --version
          ninja --version
          clang --version
          ld.lld --version
          ccache --version
          git --version
          python3 --version

      - name: Validate Network Connectivity & Exports
        run: |
          echo "=== NETWORK CONNECTIVITY (GitHub / LLVM) ==="
          curl -I https://github.com/llvm/llvm-project

  # ---------------------------------------------------------------
  # Job 3: Full LLVM/Flang build with bounds sanitizer
  # ---------------------------------------------------------------
  build-and-test:
    name: Compile & Verify LLVM/Flang
    runs-on: ubuntu-22.04
    needs: [validate-tests, extreme-preflight-checks]

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Create swap space (8GB safety net)
        run: |
          echo "Creating 8GB swap space using dd (bypassing text file busy/overlayfs issues)..."
          sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h

      - name: Checkout LLVM (shallow)
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          path: llvm-project
          fetch-depth: 1

      - name: Install build toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang lld ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-flang-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-flang-
          max-size: 5G

      - name: Integrate project into LLVM tree
        run: |
          set -euxo pipefail

          # Instrumentation pass
          cp project/src/pass/BoundsCheckInstrumentation.cpp \
             llvm-project/flang/lib/Optimizer/Transforms/
          cp project/src/pass/BoundsCheckInstrumentation.h \
             llvm-project/flang/include/flang/Optimizer/Transforms/
          sed -i '/add_flang_library(FIRTransforms/a\  BoundsCheckInstrumentation.cpp' \
             llvm-project/flang/lib/Optimizer/Transforms/CMakeLists.txt

          # Runtime library
          RUNTIME_DIR=$(find llvm-project -type d \
              \( -path "*/flang-rt/lib/runtime" -o -path "*/flang/runtime" \) \
              | head -n 1)
          cp project/src/runtime/bounds-check.cpp "$RUNTIME_DIR/"
          cp project/src/runtime/bounds-check.h   "$RUNTIME_DIR/"
          if echo "$RUNTIME_DIR" | grep -q "flang-rt"; then
            sed -i '/add_flangrt_library(flang_rt.runtime/a\  bounds-check.cpp' \
                "$RUNTIME_DIR/CMakeLists.txt"
          else
            sed -i '/add_flang_library(FlangRuntime/a\  bounds-check.cpp' \
                "$RUNTIME_DIR/CMakeLists.txt"
          fi

          # Pipeline patch
          sed -i '1s/^/#include "flang\/Optimizer\/Transforms\/BoundsCheckInstrumentation.h"\n/' \
              llvm-project/flang/lib/Optimizer/Passes/Pipelines.cpp
          sed -i '/pm.addPass(hlfir::createLowerHLFIRIntrinsics());/i\  pm.addPass(fir::createHLFIRBoundsCheckPass());' \
              llvm-project/flang/lib/Optimizer/Passes/Pipelines.cpp

      - name: Configure CMake
        run: |
          cd llvm-project && mkdir -p build && cd build
          cmake -G Ninja ../llvm \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_ENABLE_PROJECTS="flang;mlir" \
            -DLLVM_ENABLE_RUNTIMES="flang-rt" \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_USE_LINKER=lld \
            -DBUILD_SHARED_LIBS=ON \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_BUILD_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=1

      - name: Build Flang
        run: |
          cd llvm-project/build
          ninja -j 2 flang-new

      - name: Verify bounds sanitizer
        run: |
          cd llvm-project/build
          bin/flang-new -O2 -fcheck=bounds ../../project/src/demo/demo.f90 -o demo_run
          ./demo_run 2> demo_error.log || true
          cat demo_error.log

          if grep -q "HLFIR BOUNDS VIOLATION DETECTED" demo_error.log; then
            echo "SUCCESS: Bounds sanitizer intercepted OOB access."
          else
            echo "FAILURE: Bounds sanitizer did not intercept the error."
            exit 1
          fi

      - name: Upload flang-new binary
        uses: actions/upload-artifact@v4
        with:
          name: flang-new-linux-x86_64
          path: llvm-project/build/bin/flang-new
          retention-days: 7
