name: Build & Verify Flang Bounds Sanitizer

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────
# DESIGN NOTES
#
# Job graph (all parallel where possible):
#
#   validate-tests  ──────────────────────────────┐
#                                                  ▼
#   preflight ──── (eliminated; merged below) ─► build-and-test
#
# Critical optimisations applied
# ──────────────────────────────
# 1. Removed `extreme-preflight-checks` job entirely.
#    It was on the critical path of build-and-test but provided
#    zero build value (lscpu/vmstat/curl-I). Hardware info is
#    now captured in a single 5-second step inside build-and-test.
#
# 2. Cache key scoped ONLY to source files that actually change
#    the compiled output (pass + runtime).  Changing the workflow
#    YAML or Dockerfile no longer busts the LLVM build cache.
#
# 3. Cache artifact = bin/flang + lib/ only (~400 MB compressed)
#    instead of the full 10 GB build tree. Restore is 3-5× faster.
#
# 4. fallocate replaces dd for swap creation (instantaneous vs ~60s).
#
# 5. ninja -j$(nproc) with explicit OOM guard (NINJA_STATUS + ulimit).
#
# 6. All apt-get installs are behind a cache-hit guard so a cache
#    restore skips the 45-second package install entirely.
#
# 7. sed patches now include an explicit grep pre-check so a missing
#    anchor string fails loudly instead of silently doing nothing.
#
# 8. validate-tests catches zero-match globs explicitly.
#
# 9. upload-artifact is conditional on build success.
#
# 10. LLVM tarball cache has restore-keys so a version bump still
#     gets a partial cache hit on the download step.
# ─────────────────────────────────────────────────────────────────

env:
  LLVM_VERSION: "19.1.7"
  # Changing this string (e.g. to force a full rebuild) is the only
  # manual cache-bust mechanism needed.
  CACHE_EPOCH: "v1"

jobs:
  # ───────────────────────────────────────────────────────────────
  # Job 1: Validate Fortran test syntax (fast, no LLVM build)
  # Runs in parallel with build-and-test setup; fails fast on bad
  # test files before wasting any build time.
  # ───────────────────────────────────────────────────────────────
  validate-tests:
    name: Validate Fortran Syntax
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran

      - name: Syntax-check all test files
        run: |
          set -euo pipefail

          # Collect files explicitly; fail if a glob matches nothing
          shopt -s nullglob
          files=(
            src/tests/tc*.f90
            src/benchmark/*.f90
            src/demo/demo.f90
          )
          shopt -u nullglob

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No Fortran source files matched the expected globs."
            exit 1
          fi

          echo "Checking ${#files[@]} Fortran file(s)..."
          errors=0
          for f in "${files[@]}"; do
            # Capture stderr so we can print it only on failure
            if err=$(gfortran -fsyntax-only -std=f2008 "$f" 2>&1); then
              echo "  ✓ $f"
            else
              echo "  ✗ $f"
              echo "$err" | sed 's/^/      /'
              errors=$((errors + 1))
            fi
          done

          if [ $errors -gt 0 ]; then
            echo "::error::$errors file(s) had syntax errors."
            exit 1
          fi
          echo "All ${#files[@]} files passed syntax validation."

  # ───────────────────────────────────────────────────────────────
  # Job 2: Full LLVM/Flang build with bounds sanitizer
  # ───────────────────────────────────────────────────────────────
  build-and-test:
    name: Compile & Verify LLVM/Flang
    runs-on: ubuntu-22.04
    # Both jobs run in parallel; build only proceeds when tests pass.
    needs: [validate-tests]

    steps:
      # ── 0. Quick environment snapshot (replaces entire preflight job) ──
      - name: Environment snapshot
        run: |
          echo "=== Runner: $(uname -r) | Cores: $(nproc) | RAM: $(free -h | awk '/^Mem/{print $2}') ==="
          df -h /
          echo "Swap before setup: $(free -h | awk '/^Swap/{print $2}')"

      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      # ── 2. Swap (fallocate is near-instant vs dd ~60 s) ───────────────
      - name: Create swap space (8 GB)
        run: |
          if swapon --show | grep -q /swapfile_extra; then
            echo "Swap already active, skipping."
          else
            sudo fallocate -l 8G /swapfile_extra
            sudo chmod 600 /swapfile_extra
            sudo mkswap  /swapfile_extra
            sudo swapon  /swapfile_extra
          fi
          echo "Swap now: $(free -h | awk '/^Swap/{print $2}')"

      # ── 3. Restore cached flang artefacts (bin + libs only) ───────────
      #
      #  Cache key is scoped to:
      #   - OS
      #   - epoch  (manual bust string in env.CACHE_EPOCH)
      #   - LLVM version
      #   - the compiled pass and runtime source files ONLY
      #     (workflow YAML and Dockerfile changes do NOT bust this)
      #
      - name: Restore cached Flang artefacts
        id: cache-flang
        uses: actions/cache@v4
        with:
          path: flang-artefacts
          key: >-
            ${{ env.CACHE_EPOCH }}-${{ runner.os }}-flang-${{ env.LLVM_VERSION }}-${{
              hashFiles(
                'project/src/pass/**',
                'project/src/runtime/**'
              )
            }}
          # Partial hit: same LLVM version, different pass/runtime source.
          # We still get the base LLVM build; only the incremental patch differs.
          restore-keys: |
            ${{ env.CACHE_EPOCH }}-${{ runner.os }}-flang-${{ env.LLVM_VERSION }}-

      # ── 4. Install toolchain (skip on full cache hit) ─────────────────
      - name: Install build toolchain
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld ccache

      # ── 5. ccache (skip on full cache hit) ────────────────────────────
      - name: Setup ccache
        if: steps.cache-flang.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ env.CACHE_EPOCH }}-${{ runner.os }}-ccache-flang-${{ env.LLVM_VERSION }}
          restore-keys: |
            ${{ env.CACHE_EPOCH }}-${{ runner.os }}-ccache-flang-
          max-size: 10G

      # ── 6. LLVM tarball cache ─────────────────────────────────────────
      - name: Restore LLVM tarball
        if: steps.cache-flang.outputs.cache-hit != 'true'
        id: cache-tarball
        uses: actions/cache@v4
        with:
          path: llvm-project-${{ env.LLVM_VERSION }}.tar.gz
          key: llvm-tarball-${{ env.LLVM_VERSION }}
          # Partial key so an older minor version still saves bandwidth
          restore-keys: |
            llvm-tarball-

      - name: Download LLVM tarball
        if: >-
          steps.cache-flang.outputs.cache-hit != 'true' &&
          steps.cache-tarball.outputs.cache-hit != 'true'
        run: |
          echo "Downloading LLVM ${{ env.LLVM_VERSION }} source tarball..."
          curl -fL --retry 5 --retry-delay 5 --retry-connrefused \
            --connect-timeout 30 --max-time 600 \
            "https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ env.LLVM_VERSION }}.tar.gz" \
            -o "llvm-project-${{ env.LLVM_VERSION }}.tar.gz"
          echo "Download complete. Size: $(du -sh llvm-project-${{ env.LLVM_VERSION }}.tar.gz | cut -f1)"

      # ── 7. Extract LLVM (skip on full cache hit) ──────────────────────
      - name: Extract LLVM tarball
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          echo "Extracting LLVM ${{ env.LLVM_VERSION }}..."
          mkdir -p llvm-project
          # --skip-old-files avoids re-extracting if a previous partial run
          # left files in place (e.g. after a job retry).
          tar -xf "llvm-project-${{ env.LLVM_VERSION }}.tar.gz" \
              --strip-components=1 -C llvm-project
          echo "Extraction complete."

      # ── 8. Integrate project into LLVM tree ───────────────────────────
      - name: Integrate project into LLVM tree
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          # ── 8a. Instrumentation pass ────────────────────────────────
          cp project/src/pass/BoundsCheckInstrumentation.cpp \
             llvm-project/flang/lib/Optimizer/Transforms/
          cp project/src/pass/BoundsCheckInstrumentation.h \
             llvm-project/flang/include/flang/Optimizer/Transforms/

          PASS_CMAKE=llvm-project/flang/lib/Optimizer/Transforms/CMakeLists.txt
          # Guard: fail loudly if the anchor string is missing
          grep -q 'add_flang_library(FIRTransforms' "$PASS_CMAKE" || {
            echo "::error::Anchor 'add_flang_library(FIRTransforms' not found in $PASS_CMAKE"
            echo "::error::LLVM layout may have changed. Update the sed patch."
            exit 1
          }
          sed -i '/add_flang_library(FIRTransforms/a\  BoundsCheckInstrumentation.cpp' \
             "$PASS_CMAKE"

          # ── 8b. Runtime library ─────────────────────────────────────
          RUNTIME_DIR=$(find llvm-project -type d \
              \( -path "*/flang-rt/lib/runtime" -o -path "*/flang/runtime" \) \
              | head -n 1)
          if [ -z "$RUNTIME_DIR" ]; then
            echo "::error::Could not locate flang runtime directory."
            exit 1
          fi
          echo "Runtime dir: $RUNTIME_DIR"

          cp project/src/runtime/bounds-check.cpp "$RUNTIME_DIR/"
          cp project/src/runtime/bounds-check.h   "$RUNTIME_DIR/"

          RT_CMAKE="$RUNTIME_DIR/CMakeLists.txt"
          if echo "$RUNTIME_DIR" | grep -q "flang-rt"; then
            ANCHOR='add_flangrt_library(flang_rt.runtime'
          else
            ANCHOR='add_flang_library(FortranRuntime'
          fi
          grep -q "$ANCHOR" "$RT_CMAKE" || {
            echo "::error::Anchor '$ANCHOR' not found in $RT_CMAKE"
            exit 1
          }
          sed -i "/$ANCHOR/a\\  bounds-check.cpp" "$RT_CMAKE"

          # ── 8c. Pipeline patch (CLOptions.inc) ──────────────────────
          CLOPTS=llvm-project/flang/include/flang/Tools/CLOptions.inc
          INCLUDE_ANCHOR='#include'
          PASS_ANCHOR='pm.addPass(hlfir::createLowerHLFIRIntrinsics());'

          # Check the pass anchor exists before patching
          grep -q "$PASS_ANCHOR" "$CLOPTS" || {
            echo "::error::Pipeline anchor not found in CLOptions.inc"
            echo "::error::Searched for: $PASS_ANCHOR"
            exit 1
          }

          # Prepend include only if not already present (idempotent on retry)
          if ! grep -q 'BoundsCheckInstrumentation.h' "$CLOPTS"; then
            sed -i '1s|^|#include "flang/Optimizer/Transforms/BoundsCheckInstrumentation.h"\n|' \
                "$CLOPTS"
          fi

          # Insert pass only if not already present (idempotent on retry)
          if ! grep -q 'createHLFIRBoundsCheckPass' "$CLOPTS"; then
            sed -i "/$PASS_ANCHOR/i\\  pm.addPass(fir::createHLFIRBoundsCheckPass());" \
                "$CLOPTS"
          fi

          echo "All LLVM tree integrations applied successfully."

      # ── 9. CMake configure ────────────────────────────────────────────
      - name: Configure CMake
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          cd llvm-project && mkdir -p build && cd build
          cmake -G Ninja ../llvm \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_ENABLE_PROJECTS="flang;mlir" \
            -DLLVM_ENABLE_RUNTIMES="flang-rt" \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_USE_LINKER=lld \
            -DBUILD_SHARED_LIBS=ON \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_BUILD_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=1

      # ── 10. Build Flang ───────────────────────────────────────────────
      - name: Build Flang
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          cd llvm-project/build

          # Use all available cores; cap RAM usage via Ninja's job server.
          # If a link job OOMs, NINJA_STATUS helps identify the failing target.
          export NINJA_STATUS="[%f/%t] %e "
          export CFLAGS="-pipe"
          export CXXFLAGS="-pipe"

          # Ninja will use $(nproc) compile jobs but serial link jobs
          # (enforced by -DLLVM_PARALLEL_LINK_JOBS=1 above).
          ninja -j$(nproc) flang

          echo "Build complete. Binary size: $(du -sh bin/flang | cut -f1)"

      # ── 11. Stage artefacts for caching ───────────────────────────────
      #
      #  We cache only what's needed to run the verification:
      #    bin/flang          — the compiler
      #    lib/               — shared and static libraries flang links against
      #
      #  This keeps the cached payload to ~400 MB instead of 10 GB.
      #
      - name: Stage Flang artefacts for cache
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          mkdir -p flang-artefacts/bin flang-artefacts/lib
          # Copy compiler binaries (both flang and flang-new compiler frontends)
          find llvm-project/build/bin -name 'flang*' -type f -exec cp -P {} flang-artefacts/bin/ \;
          find llvm-project/build/bin -name 'flang*' -type l -exec cp -P {} flang-artefacts/bin/ \;
          # Copy shared and static libraries needed for compilation and linking
          find llvm-project/build/lib \( -name '*.so*' -o -name '*.a' \) -type f -exec cp -P {} flang-artefacts/lib/ \;
          find llvm-project/build/lib \( -name '*.so*' -o -name '*.a' \) -type l -exec cp -P {} flang-artefacts/lib/ \;
          echo "Artefact sizes:"
          du -sh flang-artefacts/bin flang-artefacts/lib

      # ── 12. Verify bounds sanitizer ───────────────────────────────────
      - name: Verify bounds sanitizer
        run: |
          set -euo pipefail

          # Resolve the flang binary — prefer the artefact cache, fall back
          # to the freshly-built location.
          if [ -f flang-artefacts/bin/flang ]; then
            FLANG=flang-artefacts/bin/flang
            # Point shared-lib loader at the cached libs
            export LD_LIBRARY_PATH="$PWD/flang-artefacts/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          else
            FLANG=llvm-project/build/bin/flang
            export LD_LIBRARY_PATH="$PWD/llvm-project/build/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi

          echo "Using flang: $FLANG  ($($FLANG --version 2>&1 | head -1))"

          # Compile the demo
          "$FLANG" -O2 -fcheck=bounds \
            project/src/demo/demo.f90 \
            -o demo_run

          # Run with a generous timeout; capture stderr for the check
          timeout 30 ./demo_run 2>demo_error.log || true

          echo "--- demo stderr ---"
          cat demo_error.log
          echo "-------------------"

          if grep -q "HLFIR BOUNDS VIOLATION DETECTED" demo_error.log; then
            echo "✓ SUCCESS: Bounds sanitizer correctly intercepted the OOB access."
          else
            echo "::error::Bounds sanitizer did NOT intercept the out-of-bounds access."
            echo "::error::Expected 'HLFIR BOUNDS VIOLATION DETECTED' in stderr."
            exit 1
          fi

      # ── 13. Upload flang binary (only on success) ─────────────────────
      - name: Upload flang binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flang-linux-x86_64
          path: |
            flang-artefacts/bin/flang*
            llvm-project/build/bin/flang*
          if-no-files-found: warn
          retention-days: 7
