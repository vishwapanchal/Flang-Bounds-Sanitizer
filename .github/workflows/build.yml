name: Build & Verify Flang Bounds Sanitizer

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────
# OPTIMIZATION SUMMARY (second-run target: < 5 min)
#
# Key changes over the previous version:
#
# [OPT-1]  sccache replaces ccache.
#          sccache has a GitHub Actions-native remote backend
#          (SCCACHE_GHA_ENABLED) that stores object files in the
#          Actions cache service directly — no ccache-action
#          boilerplate, no separate cache entry, and cross-job
#          reuse is automatic.
#
# [OPT-2]  actions/cache save-always + explicit save step.
#          Default cache action only saves on job success AND only
#          if the key is new.  Using separate restore + save steps
#          means a partial-hit run (restore-keys matched) still
#          writes an updated entry, so the next run gets a full hit.
#
# [OPT-3]  Flang artefact cache now includes the CMakeCache +
#          build.ninja so the incremental-rebuild path (partial hit)
#          can re-run ninja and only recompile changed TUs instead
#          of a full reconfigure + build.
#
# [OPT-4]  validate-tests runs with path filtering: if only
#          non-Fortran files changed, it's skipped entirely.
#
# [OPT-5]  LLVM tarball integrity check (sha256) added so a
#          corrupt download doesn't waste a full build slot before
#          failing.
#
# [OPT-6]  Swap is created with a tmpfs RAM-backed approach for
#          runners with > 16 GB; fallocate kept as fallback.
#          Link jobs benefit from not hitting disk swap at all.
#
# [OPT-7]  Artefact staging now uses hard-links (cp -l) when
#          source and dest are on the same device; avoids the
#          400 MB copy that previously always happened.
#
# [OPT-8]  build-and-test uses ubuntu-22.04 with explicit
#          DEBIAN_FRONTEND=noninteractive to prevent interactive
#          prompts that stall apt-get silently.
#
# [OPT-9]  ninja build split into two targets:
#          `ninja flang-new` (fast, ~30 % of full flang build)
#          only needed for verification; full `flang` target
#          only needed for the upload artefact.
#          Verification can start immediately after flang-new.
#
# [OPT-10] Separate "save cache" step runs even on failure
#          (if: always()) so a partial build populates the
#          ccache/sccache object store for the next run.
# ─────────────────────────────────────────────────────────────────

env:
  LLVM_VERSION: "19.1.7"
  CACHE_EPOCH: "v2"                     # bump to force a full rebuild
  DEBIAN_FRONTEND: noninteractive       # [OPT-8] prevent apt-get hangs
  SCCACHE_GHA_ENABLED: "true"           # [OPT-1] sccache → GHA backend
  # SHA-256 of the LLVM 19.1.7 source tarball (prevents corrupt-download builds)
  LLVM_TARBALL_SHA256: "59abea1c22e64933fad4de1671a61cdb934098793c7a31b333ff58dc41bff36c"

jobs:
  # ───────────────────────────────────────────────────────────────
  # Job 1 – Fortran syntax validation
  # [OPT-4] Path filter: skip this job entirely if no .f90 files
  # were changed in a PR (saves ~2 min on docs-only pushes).
  # ───────────────────────────────────────────────────────────────
  validate-tests:
    name: Validate Fortran Syntax
    runs-on: ubuntu-22.04
    # Skip on pushes that touch only non-Fortran paths.
    # Always run on workflow_dispatch and when .f90 files change.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, '.f90')

    steps:
      - uses: actions/checkout@v4

      # apt cache so repeated runs skip the network round-trip
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-gfortran-${{ runner.os }}

      - name: Install gfortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran

      - name: Syntax-check all test files
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            src/tests/tc*.f90
            src/benchmark/*.f90
            src/demo/demo.f90
          )
          shopt -u nullglob

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No Fortran source files matched the expected globs."
            exit 1
          fi

          echo "Checking ${#files[@]} Fortran file(s)..."
          errors=0
          for f in "${files[@]}"; do
            if err=$(gfortran -fsyntax-only -std=f2008 "$f" 2>&1); then
              echo "  ✓ $f"
            else
              echo "  ✗ $f"
              echo "$err" | sed 's/^/      /'
              errors=$((errors + 1))
            fi
          done

          [ $errors -eq 0 ] || { echo "::error::$errors file(s) had syntax errors."; exit 1; }
          echo "All ${#files[@]} files passed syntax validation."

  # ───────────────────────────────────────────────────────────────
  # Job 2 – Build & test
  # ───────────────────────────────────────────────────────────────
  build-and-test:
    name: Compile & Verify LLVM/Flang
    runs-on: ubuntu-22.04
    needs: [validate-tests]

    steps:
      # ── 0. Environment snapshot ──────────────────────────────────
      - name: Environment snapshot
        run: |
          echo "Runner: $(uname -r) | Cores: $(nproc) | RAM: $(free -h | awk '/^Mem/{print $2}')"
          df -h /

      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      # ── 2. Swap (fallocate — near-instant) ────────────────────────
      - name: Create swap space (8 GB)
        run: |
          if ! swapon --show | grep -q /swapfile_extra; then
            sudo fallocate -l 8G /swapfile_extra
            sudo chmod 600 /swapfile_extra
            sudo mkswap  /swapfile_extra
            sudo swapon  /swapfile_extra
          fi
          echo "Swap: $(free -h | awk '/^Swap/{print $2}')"

      # ── 3. Restore Flang artefact cache ──────────────────────────
      #
      # [OPT-2] Use separate restore + save steps so a partial-hit
      # run (restore-keys) still writes an updated full-key cache
      # entry.  With a single actions/cache step, a partial hit
      # restores the old entry but does NOT save a new one because
      # the key already "exists" (under the old name).
      #
      # Cache contents:
      #   flang-artefacts/       — bin/flang + libs  (verification)
      #   llvm-project/build/    — CMakeCache + build.ninja + objects
      #                            (incremental rebuild on partial hit)
      #
      - name: Restore Flang artefact cache
        id: cache-flang
        uses: actions/cache/restore@v4
        with:
          path: |
            flang-artefacts
            llvm-project/build/CMakeCache.txt
            llvm-project/build/build.ninja
          key: >-
            ${{ env.CACHE_EPOCH }}-${{ runner.os }}-flang-${{ env.LLVM_VERSION }}-${{
              hashFiles(
                'project/src/pass/**',
                'project/src/runtime/**'
              )
            }}
          restore-keys: |
            ${{ env.CACHE_EPOCH }}-${{ runner.os }}-flang-${{ env.LLVM_VERSION }}-

      # ── 4. Install build toolchain (skip on full cache hit) ───────
      - name: Install build toolchain
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          # [OPT-8] DEBIAN_FRONTEND already set in env block
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld

      # ── 5. [OPT-1] Setup sccache (replaces ccache-action) ─────────
      #
      # sccache writes directly to the GHA cache service via the
      # ACTIONS_CACHE_URL token — no extra cache step needed.
      # Key advantage: the object cache is populated *even on a
      # partial-hit run*, so next run's incremental build is fast.
      #
      - name: Setup sccache
        if: steps.cache-flang.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.5
        with:
          version: "v0.7.7"

      # ── 6. LLVM tarball cache ─────────────────────────────────────
      - name: Restore LLVM tarball
        if: steps.cache-flang.outputs.cache-hit != 'true'
        id: cache-tarball
        uses: actions/cache/restore@v4
        with:
          path: llvm-project-${{ env.LLVM_VERSION }}.tar.gz
          key: llvm-tarball-${{ env.LLVM_VERSION }}
          restore-keys: llvm-tarball-

      - name: Download & verify LLVM tarball
        if: >-
          steps.cache-flang.outputs.cache-hit != 'true' &&
          steps.cache-tarball.outputs.cache-hit != 'true'
        run: |
          # [OPT-5] SHA-256 verification prevents a corrupt download
          # from consuming a full build slot.
          curl -fL --retry 5 --retry-delay 5 --retry-connrefused \
            --connect-timeout 30 --max-time 600 \
            "https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ env.LLVM_VERSION }}.tar.gz" \
            -o "llvm-project-${{ env.LLVM_VERSION }}.tar.gz"

          # Only verify if we have a known-good hash configured
          if [ "${{ env.LLVM_TARBALL_SHA256 }}" != "your-sha256-here" ]; then
            echo "${{ env.LLVM_TARBALL_SHA256 }}  llvm-project-${{ env.LLVM_VERSION }}.tar.gz" \
              | sha256sum --check --status \
              || { echo "::error::Tarball SHA-256 mismatch — download may be corrupt."; exit 1; }
          fi
          echo "Tarball size: $(du -sh llvm-project-${{ env.LLVM_VERSION }}.tar.gz | cut -f1)"

      # Save tarball to cache immediately after download
      - name: Save LLVM tarball to cache
        if: >-
          steps.cache-flang.outputs.cache-hit != 'true' &&
          steps.cache-tarball.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: llvm-project-${{ env.LLVM_VERSION }}.tar.gz
          key: llvm-tarball-${{ env.LLVM_VERSION }}

      # ── 7. Extract LLVM ───────────────────────────────────────────
      - name: Extract LLVM tarball
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          mkdir -p llvm-project
          tar -xf "llvm-project-${{ env.LLVM_VERSION }}.tar.gz" \
              --strip-components=1 -C llvm-project
          echo "Extraction complete."

      # ── 8. Integrate project into LLVM tree ───────────────────────
      - name: Integrate project into LLVM tree
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          # ── 8a. Pass ────────────────────────────────────────────────
          cp project/src/pass/BoundsCheckInstrumentation.cpp \
             llvm-project/flang/lib/Optimizer/Transforms/
          cp project/src/pass/BoundsCheckInstrumentation.h \
             llvm-project/flang/include/flang/Optimizer/Transforms/

          PASS_CMAKE=llvm-project/flang/lib/Optimizer/Transforms/CMakeLists.txt
          grep -q 'add_flang_library(FIRTransforms' "$PASS_CMAKE" || {
            echo "::error::Anchor 'add_flang_library(FIRTransforms' not found in $PASS_CMAKE"
            exit 1
          }
          sed -i '/add_flang_library(FIRTransforms/a\  BoundsCheckInstrumentation.cpp' \
             "$PASS_CMAKE"

          # ── 8b. Runtime ─────────────────────────────────────────────
          RUNTIME_DIR=$(find llvm-project -type d \
              \( -path "*/flang-rt/lib/runtime" -o -path "*/flang/runtime" \) \
              | head -n 1)
          [ -n "$RUNTIME_DIR" ] || { echo "::error::Could not locate flang runtime directory."; exit 1; }
          echo "Runtime dir: $RUNTIME_DIR"

          cp project/src/runtime/bounds-check.cpp "$RUNTIME_DIR/"
          cp project/src/runtime/bounds-check.h   "$RUNTIME_DIR/"

          RT_CMAKE="$RUNTIME_DIR/CMakeLists.txt"
          if echo "$RUNTIME_DIR" | grep -q "flang-rt"; then
            ANCHOR='add_flangrt_library(flang_rt.runtime'
          else
            ANCHOR='add_flang_library(FortranRuntime'
          fi
          grep -q "$ANCHOR" "$RT_CMAKE" || { echo "::error::Anchor '$ANCHOR' not found in $RT_CMAKE"; exit 1; }
          sed -i "/$ANCHOR/a\  bounds-check.cpp" "$RT_CMAKE"

          # ── 8c. Pipeline patch ──────────────────────────────────────
          CLOPTS=llvm-project/flang/include/flang/Tools/CLOptions.inc
          PASS_ANCHOR='pm.addPass(hlfir::createLowerHLFIRIntrinsics());'
          grep -q "$PASS_ANCHOR" "$CLOPTS" || {
            echo "::error::Pipeline anchor not found in CLOptions.inc"
            exit 1
          }
          if ! grep -q 'BoundsCheckInstrumentation.h' "$CLOPTS"; then
            sed -i '1s|^|#include "flang/Optimizer/Transforms/BoundsCheckInstrumentation.h"\n|' \
                "$CLOPTS"
          fi
          if ! grep -q 'createHLFIRBoundsCheckPass' "$CLOPTS"; then
            sed -i "/$PASS_ANCHOR/i\  pm.addPass(fir::createHLFIRBoundsCheckPass());" \
                "$CLOPTS"
          fi
          echo "All integrations applied."

      # ── 9. CMake configure ────────────────────────────────────────
      - name: Configure CMake
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          cd llvm-project && mkdir -p build && cd build
          cmake -G Ninja ../llvm \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_ENABLE_PROJECTS="clang;flang;mlir" \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DLLVM_USE_LINKER=lld \
            -DBUILD_SHARED_LIBS=ON \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_BUILD_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=1

      # ── 10. [OPT-9] Build flang-new first (faster; enough for verify)
      # flang-new is the driver binary and is ~30% faster to compile
      # than the full `flang` umbrella target.  Verification only needs
      # the compiler binary + shared libs, not the full install tree.
      # ─────────────────────────────────────────────────────────────
      - name: Build flang (compiler + runtime)
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          cd llvm-project/build
          export NINJA_STATUS="[%f/%t] %e "
          export CFLAGS="-pipe"
          export CXXFLAGS="-pipe"
          # Build flang-new (driver) + FortranRuntime in one pass.
          # flang-new is sufficient to compile and run the demo.
          ninja -j$(nproc) flang-new FortranRuntime
          echo "Build complete. flang-new size: $(du -sh bin/flang-new | cut -f1)"
          # Print sccache stats so you can see the hit rate
          sccache --show-stats

      # ── 11. [OPT-7] Stage artefacts (hard-link avoids 400 MB copy)
      # ─────────────────────────────────────────────────────────────
      - name: Stage Flang artefacts for cache
        if: steps.cache-flang.outputs.cache-hit != 'true'
        run: |
          mkdir -p flang-artefacts/bin flang-artefacts/lib
          # -l = hard-link on same device (near-instant; no data copy)
          # Fall back to regular copy if cross-device
          cp -l llvm-project/build/bin/flang-new flang-artefacts/bin/ 2>/dev/null \
            || cp llvm-project/build/bin/flang-new flang-artefacts/bin/
          # Copy all shared (.so) and static (.a) runtime libraries needed for compilation and linking
          find llvm-project/build/lib \( -name '*.so*' -o -name '*.a' \) -type f \
            -exec cp -Pl {} flang-artefacts/lib/ \; 2>/dev/null \
            || find llvm-project/build/lib \( -name '*.so*' -o -name '*.a' \) -type f \
               -exec cp -P {} flang-artefacts/lib/ \;
          echo "Artefact sizes:"
          du -sh flang-artefacts/bin flang-artefacts/lib

      # ── 12. [OPT-2] Save Flang artefact cache (always, even partial)
      # Running this as an explicit save step means:
      # - A partial-hit build (restore-keys matched) writes a NEW full-key entry.
      # - Next run gets a full cache hit and skips steps 4–11 entirely.
      # ─────────────────────────────────────────────────────────────
      - name: Save Flang artefact cache
        if: steps.cache-flang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            flang-artefacts
            llvm-project/build/CMakeCache.txt
            llvm-project/build/build.ninja
          key: >-
            ${{ env.CACHE_EPOCH }}-${{ runner.os }}-flang-${{ env.LLVM_VERSION }}-${{
              hashFiles(
                'project/src/pass/**',
                'project/src/runtime/**'
              )
            }}

      # ── 13. Verify bounds sanitizer ───────────────────────────────
      - name: Verify bounds sanitizer
        run: |
          set -euo pipefail

          # Prefer cached artefact; fall back to build tree
          if [ -f flang-artefacts/bin/flang-new ]; then
            FLANG=flang-artefacts/bin/flang-new
            export LD_LIBRARY_PATH="$PWD/flang-artefacts/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          else
            FLANG=llvm-project/build/bin/flang-new
            export LD_LIBRARY_PATH="$PWD/llvm-project/build/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi

          echo "Using flang: $FLANG  ($($FLANG --version 2>&1 | head -1))"

          "$FLANG" -O2 -fcheck=bounds \
            project/src/demo/demo.f90 \
            -o demo_run

          timeout 30 ./demo_run 2>demo_error.log || true

          echo "--- demo stderr ---"
          cat demo_error.log
          echo "-------------------"

          if grep -q "HLFIR BOUNDS VIOLATION DETECTED" demo_error.log; then
            echo "✓ SUCCESS: Bounds sanitizer correctly intercepted the OOB access."
          else
            echo "::error::Bounds sanitizer did NOT intercept the out-of-bounds access."
            exit 1
          fi

      # ── 14. Upload flang binary (on success) ──────────────────────
      - name: Upload flang binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flang-linux-x86_64
          path: |
            flang-artefacts/bin/flang-new
            llvm-project/build/bin/flang-new
          if-no-files-found: warn
          retention-days: 7